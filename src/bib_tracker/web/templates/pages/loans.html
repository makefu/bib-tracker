{% extends "base.html" %}
{% block title %}Ausleihen · bib-tracker{% endblock %}

{% block content %}
  <div class="page-head">
    <h1>Ausleihen</h1>
    <div class="page-head__actions">
      {% for account in accounts %}
        <button
          class="btn btn--ghost"
          hx-post="/api/accounts/{{ account.name }}/poll"
          hx-swap="none"
          hx-indicator="this"
        >
          {{ account.display_name or account.name }} aktualisieren
        </button>
        <button
          class="btn"
          hx-post="/api/accounts/{{ account.name }}/renew-due"
          hx-target="#loans"
          hx-swap="outerHTML"
          hx-indicator="this"
          hx-confirm="Alle bald fälligen Medien von {{ account.display_name or account.name }} verlängern?"
        >
          Fällige verlängern
        </button>
      {% endfor %}
    </div>
  </div>

  {% include "partials/loans_table.html" %}
{% endblock %}
